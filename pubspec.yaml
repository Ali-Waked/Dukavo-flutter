name: dukavo_mobile
description: Dukavo merchant mobile application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  go_router: ^14.6.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  collection: ^1.19.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^23.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - lib/app/localization/l10n/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo-icon-square.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#F8FAFC"
  adaptive_icon_background: "#F8FAFC"
  adaptive_icon_foreground: "assets/images/logo-icon-foreground.png"
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: "assets/images/logo-icon-square.png"
    background_color: "#F8FAFC"
    theme_color: "#0F766E"
